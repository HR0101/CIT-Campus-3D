name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Select available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 scripts/select-ci-simulator.py "$RUNNER_TEMP/simulators.json" >> "$GITHUB_OUTPUT"
      - name: Build app and widget, then run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CIT-Campus-3D.xcodeproj \
            -scheme CIT-Campus-3D \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -only-testing:CIT-Campus-3DTests \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
